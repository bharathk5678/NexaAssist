[project]
name = "nexaassist"
version = "0.1.0"
description = "NexaAssist: enterprise policy and compliance RAG (Phase 1)"
requires-python = ">=3.14"
dependencies = [
    "ddtrace",
    "fastapi",
    "httpx",
    "langchain-core",
    "langchain-mongodb",
    "langchain-openai",
    "langchain-text-splitters>=1.1.3",
    "pdfplumber",
    "pydantic>=2",
    "pydantic-settings",
    # ddtrace 4.15 uses Server.run_operation, removed in PyMongo 4.18.
    "pymongo>=4.9,<4.18",
    "structlog",
    "tiktoken>=0.14.0",
    "unstructured[md]",
    "uvicorn",
]

[project.optional-dependencies]
ui = ["streamlit>=1.66"]
evaluation = [
    # RAGAS 0.4.3 imports the VertexAI wrapper removed in community 0.4.
    "langchain-community==0.3.31",
    "ragas>=0.4,<0.5",
]

[dependency-groups]
dev = [
    "ipykernel",
    "mongomock>=4.3.0",
    "mypy",
    "nbclient>=0.11.0",
    "pre-commit>=4.7.0",
    "pytest",
    "python-dotenv",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*.ipynb", "notebooks", "nexa_synthetic_data"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
