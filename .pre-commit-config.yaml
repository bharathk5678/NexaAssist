repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --locked --no-sync ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format check
        entry: uv run --locked --no-sync ruff format --check --force-exclude
        language: system
        types: [python]
