name: Quality constraints

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017/tcp
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: '3.14'
      - run: uv sync --locked --group dev --extra ui --extra evaluation
      - name: Run blocking checks
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_REF" || "$BASE_REF" =~ ^0+$ ]]; then
            BASE_REF="$(git rev-parse HEAD^)"
          fi
          make check-full BASE_REF="$BASE_REF"
      - name: Verify durable workflows against MongoDB
        env:
          NEXA_TEST_MONGODB_URI: mongodb://127.0.0.1:${{ job.services.mongodb.ports[27017] }}
          DD_TRACE_ENABLED: 'false'
          DD_LLMOBS_ENABLED: 'false'
        run: uv run --locked --no-sync pytest tests/test_agent_runs.py tests/test_agent_persistence.py -q
      - name: Verify supplied bank OpenAPI contract
        run: uv run --locked --no-sync pytest nexa_synthetic_data/api/mock_server/test_mock_api.py -q
