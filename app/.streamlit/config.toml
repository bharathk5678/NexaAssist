[theme]
base = "dark"
primaryColor = "#2459A6"
backgroundColor = "#0B0E14"
secondaryBackgroundColor = "#151C26"
textColor = "#E6EDF3"
borderColor = "#354357"
linkColor = "#7CC8FF"
font = "sans-serif"
headingFont = "sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.5rem"
paddingBottom = "2rem"

[theme.sidebar]
backgroundColor = "#11151C"
secondaryBackgroundColor = "#1B2431"
paddingTop = "1.5rem"
