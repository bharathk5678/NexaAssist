[theme]
base = "light"
primaryColor = "#2459A6"
backgroundColor = "#FBFCFD"
secondaryBackgroundColor = "#F0F4F8"
textColor = "#203547"
borderColor = "#DBE3ED"
linkColor = "#2459A6"
font = "sans-serif"
headingFont = "sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.5rem"
paddingBottom = "2rem"

[theme.sidebar]
backgroundColor = "#F0F4F8"
secondaryBackgroundColor = "#FBFCFD"
paddingTop = "1.5rem"
